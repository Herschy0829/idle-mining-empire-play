<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>矿业大亨 · 试玩版</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#211637;color:#eaf5ff;font:15px system-ui,sans-serif;display:flex;min-height:100dvh;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
    header,footer{width:min(1280px,100%,calc((100dvh - 165px)*16/9));display:flex;gap:12px;align-items:center;justify-content:space-between}h1{font-size:18px;margin:0}button{border:1px solid #a5c9ef;background:#3c5d8b;color:white;border-radius:8px;padding:8px 14px;cursor:pointer}button:disabled{opacity:.5}
    #stage{width:min(1280px,100%,calc((100dvh - 165px)*16/9));aspect-ratio:16/9;position:relative;background:#16213b;box-shadow:0 10px 40px #0005;border-radius:8px;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none;outline:none}
    #loading,#error{position:absolute;inset:0;background:#211637;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:25px;text-align:center}progress{width:min(340px,80%);height:12px;accent-color:#ffd04c}#error{display:none}footer{color:#b6c9df;font-size:13px;line-height:1.6}.hint{margin:0}a{color:#b6c9df}
    @media(max-width:700px){body{padding:8px}header{flex-wrap:wrap}footer{flex-direction:column;align-items:flex-start}h1{font-size:16px}}
    #stage:fullscreen{width:100vw;height:100vh;border-radius:0;display:flex;align-items:center;justify-content:center;background:#211637}#stage:fullscreen canvas{width:min(100vw,177.7778vh);height:min(56.25vw,100vh)}
  </style>
</head>
<body>
  <header><h1>矿业大亨 · 试玩版</h1><button id="fullscreen" type="button" disabled>全屏游玩</button></header>
  <main id="stage"><canvas id="game" width="1280" height="720" tabindex="0" aria-label="矿业大亨游戏画面"></canvas><div id="loading"><strong>正在加载矿场……</strong><progress id="progress" value="0" max="1"></progress><span>首次打开需要下载游戏资源</span></div><div id="error" role="alert"><strong>游戏暂时无法启动</strong><span id="error-text"></span><button type="button" onclick="location.reload()">重新加载</button></div></main>
  <footer><p class="hint">点击矿工后持续开采；电梯与推车需逐趟点击，雇佣对应经理后自动运输。<br>进度保存在当前浏览器。建议使用电脑浏览器；手机可尝试横屏。</p><span>测试版本 · 未接入真实广告</span></footer>
  <script src="Build/dist.loader.js"></script>
  <script>
    const canvas=document.getElementById('game');
    const showError=message=>{document.getElementById('loading').style.display='none';document.getElementById('error').style.display='flex';document.getElementById('error-text').textContent=String(message);};
    createUnityInstance(canvas,{
      dataUrl:'Build/dist.data.unityweb',frameworkUrl:'Build/dist.framework.js.unityweb',codeUrl:'Build/dist.wasm.unityweb',
      streamingAssetsUrl:'StreamingAssets',companyName:'Deep Pocket Studio',productName:'Deep Pocket Mining',productVersion:'0.1',
      showBanner:(message,type)=>{if(type==='error')console.error(message);}
    },p=>document.getElementById('progress').value=p).then(instance=>{
      document.getElementById('loading').style.display='none';canvas.focus();
      const button=document.getElementById('fullscreen');button.disabled=false;
      button.onclick=()=>document.getElementById('stage').requestFullscreen?.().catch(()=>instance.SetFullscreen(1));
    }).catch(showError);
  </script>
</body>
</html>
